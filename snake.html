<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 双人联机贪吃蛇大决战</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; --p1-color: #ec4899; --p2-color: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 640px; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        button { padding: 12px 24px; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; cursor: pointer; }
        .btn-secondary { background: #334155; margin-bottom: 20px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #111827; border-radius: 10px; margin-top: 10px; }
        .badge { padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; }
        .score-board { display: flex; justify-content: space-between; margin: 15px 0; font-size: 1.1rem; font-weight: bold; }
        
        /* 游戏画布样式 */
        #canvas-container { display: flex; justify-content: center; margin: 20px 0; }
        canvas { background: #020617; border: 4px solid #334155; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        #game-status { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 10px 0; color: #f59e0b; }
        
        /* 手机端虚拟按键样式 */
        .controls { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(2, 60px); gap: 10px; justify-content: center; margin-top: 20px; }
        .controls button { padding: 0; font-size: 1.5rem; background: #334155; }
        .controls .up { grid-column: 2; }
        .controls .left { grid-column: 1; grid-row: 2; }
        .controls .down { grid-column: 2; grid-row: 2; }
        .controls .right { grid-column: 3; grid-row: 2; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="view-lobby" class="view">
            <button class="btn-secondary" onclick="window.location.href='/'">← 返回主页</button>
            <div class="card">
                <h2>🐍 双人实时对战贪吃蛇</h2>
                <p>极速长连接支持！使用键盘键盘 <b>W A S D</b> 或 <b>↑ ↓ ← →</b> 控制方向，粉色是房主，绿色是挑战者，撞墙、撞到对方或撞到自己即输！</p>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>🏠 活跃房间</h3>
                    <button onclick="createRoom()">+ 创建房间</button>
                </div>
                <ul id="room-list"></ul>
            </div>
        </div>

        <div id="view-game" class="view">
            <button class="btn-secondary" onclick="window.location.href='/snake.html'">← 退出房间</button>
            <div class="card">
                <h2 id="game-title">游戏房间</h2>
                <span id="player-identity" class="badge" style="background: #334155; margin-bottom:10px; display:inline-block;"></span>
                
                <div class="score-board">
                    <span style="color: var(--p1-color)">房主 P1 长度: <span id="p1-score">3</span></span>
                    <span style="color: var(--p2-color)">挑战者 P2 长度: <span id="p2-score">3</span></span>
                </div>

                <div id="game-status">正在建立连接...</div>

                <div id="canvas-container">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                </div>

                <div class="controls">
                    <button class="up" onclick="changeDirection('UP')">▲</button>
                    <button class="left" onclick="changeDirection('LEFT')">◀</button>
                    <button class="down" onclick="changeDirection('DOWN')">▼</button>
                    <button class="right" onclick="changeDirection('RIGHT')">▶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚡ 填入你的 Supabase 真实凭证
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const gameId = 'snake';
        let myRole = null;
        let gameChannel = null;
        let gameTicker = null; // 本地渲染游戏主循环定时器
        let gameOver = false;

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        // 🎮 贪吃蛇核心数据配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const grid = 20; // 格子大小 (20x20 个格子)

        // 游戏共享状态
        let food = { x: 200, y: 200 };
        let snake1 = [{ x: 60, y: 100 }, { x: 40, y: 100 }, { x: 20, y: 100 }]; // P1 蛇身
        let snake2 = [{ x: 320, y: 280 }, { x: 340, y: 280 }, { x: 360, y: 280 }]; // P2 蛇身
        let d1 = 'RIGHT'; // P1 初始方向
        let d2 = 'LEFT';  // P2 初始方向

        async function init() {
            if (!roomId) {
                document.getElementById('view-lobby').classList.add('active');
                fetchRooms();
            } else {
                document.getElementById('view-game').classList.add('active');
                document.getElementById('game-title').innerText = `房间 #${roomId}`;
                myRole = localStorage.getItem(`room_${roomId}_role`);
                
                await syncBaseRoomStatus();

                if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                    document.getElementById('game-status').innerText = '❌ 未配置 Supabase 密钥';
                    alert('请先配置 Supabase 密钥！');
                    return;
                }

                connectSupabaseRealtime();
                setupKeyboardControls();
                draw(); // 初始绘制一下画面
            }
        }

        // 基础大厅与创建房间复用 Cloudflare 原来底座
        async function fetchRooms() {
            const ul = document.getElementById('room-list');
            ul.innerHTML = '<p style="text-align:center;">玩家正在热身，正在呼叫房间...</p>';
            const res = await fetch(`/api/room?action=list&gameId=${gameId}&_t=${Date.now()}`);
            const rooms = await res.json();
            ul.innerHTML = rooms.length === 0 ? '<p style="text-align:center; color:#64748b;">没有探查到房间，你来当第一个房主吧！</p>' : '';
            rooms.forEach(r => {
                const li = document.createElement('li');
                li.className = 'room-item';
                li.innerHTML = `
                    <div><strong>房间 #${r.id}</strong></div>
                    <button style="padding:6px 14px;" onclick="window.location.href='?roomId=${r.id}'" ${r.status !== 'waiting'?'disabled':''}>加入PK</button>
                `;
                ul.appendChild(li);
            });
        }

        async function createRoom() {
            const res = await fetch('/api/room?action=create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gameId }) });
            const data = await res.json();
            localStorage.setItem(`room_${data.roomId}_role`, 'p1');
            window.location.href = `?roomId=${data.roomId}`;
        }

        async function syncBaseRoomStatus() {
            const res = await fetch(`/api/room?action=status&roomId=${roomId}&gameId=${gameId}&_t=${Date.now()}`);
            if (res.status === 404) { alert('房间不存在'); window.location.href = '/snake.html'; return; }
            const room = await res.json();

            if (!myRole) {
                if (!room.p1) myRole = 'p1';
                else if (!room.p2) myRole = 'p2';
                else myRole = 'audience';
                localStorage.setItem(`room_${roomId}_role`, myRole);
            }

            document.getElementById('player-identity').innerText = { 'p1': '⚡ 房主 (P1) · 粉蛇', 'p2': '🎯 挑战者 (P2) · 绿蛇', 'audience': '👁️ 观众' }[myRole];
            
            if (room.status === 'waiting' && myRole === 'p2' && room.p2 !== 'joined') {
                await fetch('/api/room?action=join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId, gameId }) });
                setTimeout(() => { if (gameChannel) gameChannel.send({ type: 'broadcast', event: 'start-game', payload: {} }); }, 1000);
            }
        }

        // ⚡ 建立连接并监听方向和食物广播
        function connectSupabaseRealtime() {
            gameChannel = supabaseClient.channel(`snake-room-${roomId}`);

            gameChannel
                .on('broadcast', { event: 'direction-update' }, (payload) => {
                    const data = payload.payload;
                    // 毫秒级收到对手的方向变动，立刻更新本地变量
                    if (data.player === 'p1') d1 = data.dir;
                    if (data.player === 'p2') d2 = data.dir;
                })
                .on('broadcast', { event: 'food-update' }, (payload) => {
                    // 同步 P1 随机生成的食物坐标
                    food = payload.payload.food;
                })
                .on('broadcast', { event: 'start-game' }, () => {
                    location.reload(); // 触发全员刷新，进入游戏进行中状态
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        checkRoomStateAndRun();
                    }
                });
        }

        async function checkRoomStateAndRun() {
            const res = await fetch(`/api/room?action=status&roomId=${roomId}&gameId=${gameId}&_t=${Date.now()}`);
            const room = await res.json();
            const statusText = document.getElementById('game-status');

            if (room.status === 'waiting') {
                statusText.innerText = '⏳ 等待挑战者加入房间...';
            } else if (room.status === 'playing') {
                statusText.innerText = '🟢 激战中！冲啊！';
                // 每 150 毫秒刷新一次游戏逻辑（贪吃蛇的前进速度）
                gameTicker = setInterval(gameLoop, 150); 
                
                // 由 P1 充当主机，在游戏刚开始时，生成并广播一次食物
                if (myRole === 'p1') { generateAndBroadcastFood(); }
            } else if (room.status === 'finished') {
                statusText.innerText = '🏁 比赛已结束';
            }
        }

        // ⌨️ 设置本地键盘控制
        function setupKeyboardControls() {
            document.addEventListener('keydown', (e) => {
                if (gameOver || (myRole !== 'p1' && myRole !== 'p2')) return;
                
                let requestedDir = null;
                if (e.key === 'w' || e.key === 'ArrowUp') requestedDir = 'UP';
                if (e.key === 's' || e.key === 'ArrowDown') requestedDir = 'DOWN';
                if (e.key === 'a' || e.key === 'ArrowLeft') requestedDir = 'LEFT';
                if (e.key === 'd' || e.key === 'ArrowRight') requestedDir = 'RIGHT';

                if (requestedDir) changeDirection(requestedDir);
            });
        }

        // 判定方向不能直接180度反向调头
        function changeDirection(newDir) {
            let currentDir = myRole === 'p1' ? d1 : d2;
            
            if (newDir === 'UP' && currentDir === 'DOWN') return;
            if (newDir === 'DOWN' && currentDir === 'UP') return;
            if (newDir === 'LEFT' && currentDir === 'RIGHT') return;
            if (newDir === 'RIGHT' && currentDir === 'LEFT') return;

            // 1. 先更新本地方向
            if (myRole === 'p1') d1 = newDir;
            if (myRole === 'p2') d2 = newDir;

            // 2. ✨ 核心提速：瞬间广播给对手，让对手电脑里的你改变方向
            gameChannel.send({
                type: 'broadcast',
                event: 'direction-update',
                payload: { player: myRole, dir: newDir }
            });
        }

        // P1 负责计算食物生成的随机位置
        function generateAndBroadcastFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                y: Math.floor(Math.random() * (canvas.height / grid)) * grid
            };
            gameChannel.send({ type: 'broadcast', event: 'food-update', payload: { food } });
        }

        // 核心游戏逻辑主循环（每150毫秒运行一次）
        function gameLoop() {
            if (gameOver) return;

            // --- 1. 计算 P1 蛇头前进坐标 ---
            let p1Head = { x: snake1[0].x, y: snake1[0].y };
            if (d1 === 'RIGHT') p1Head.x += grid;
            if (d1 === 'LEFT')  p1Head.x -= grid;
            if (d1 === 'UP')    p1Head.y -= grid;
            if (d1 === 'DOWN')  p1Head.y += grid;

            // --- 2. 计算 P2 蛇头前进坐标 ---
            let p2Head = { x: snake2[0].x, y: snake2[0].y };
            if (d2 === 'RIGHT') p2Head.x += grid;
            if (d2 === 'LEFT')  p2Head.x -= grid;
            if (d2 === 'UP')    p2Head.y -= grid;
            if (d2 === 'DOWN')  p2Head.y += grid;

            // --- 3. 检查吃食物逻辑 ---
            let p1Eats = (p1Head.x === food.x && p1Head.y === food.y);
            let p2Eats = (p2Head.x === food.x && p2Head.y === food.y);

            // 更新 P1 蛇身
            snake1.unshift(p1Head);
            if (p1Eats) {
                document.getElementById('p1-score').innerText = snake1.length;
                if (myRole === 'p1') generateAndBroadcastFood(); // P1 负责重新生成食物
            } else {
                snake1.pop();
            }

            // 更新 P2 蛇身
            snake2.unshift(p2Head);
            if (p2Eats) {
                document.getElementById('p2-score').innerText = snake2.length;
            } else {
                snake2.pop();
            }

            // --- 4. 碰撞死伤判定 ---
            checkCollisions();

            // --- 5. 重新绘制新画面 ---
            draw();
        }

        function checkCollisions() {
            const h1 = snake1[0];
            const h2 = snake2[0];

            let p1Dead = false;
            let p2Dead = false;

            // 撞墙判定
            if (h1.x < 0 || h1.x >= canvas.width || h1.y < 0 || h1.y >= canvas.height) p1Dead = true;
            if (h2.x < 0 || h2.x >= canvas.width || h2.y < 0 || h2.y >= canvas.height) p2Dead = true;

            // P1 撞自己或撞 P2 的身体
            snake1.forEach((part, index) => { if (index > 0 && h1.x === part.x && h1.y === part.y) p1Dead = true; });
            snake2.forEach(part => { if (h1.x === part.x && h1.y === part.y) p1Dead = true; });

            // P2 撞自己或撞 P1 的身体
            snake2.forEach((part, index) => { if (index > 0 && h2.x === part.x && h2.y === part.y) p2Dead = true; });
            snake1.forEach(part => { if (h2.x === part.x && h2.y === part.y) p2Dead = true; });

            if (p1Dead || p2Dead) {
                gameOver = true;
                clearInterval(gameTicker);
                const statusText = document.getElementById('game-status');

                if (p1Dead && p2Dead) {
                    statusText.innerText = '💥 惨烈！双方同时玉石俱焚（平局）！';
                } else if (p1Dead) {
                    statusText.innerText = '🎉 挑战者 (P2) 获得胜利！P1 扑街。';
                    archiveWinner('p2');
                } else if (p2Dead) {
                    statusText.innerText = '🎉 房主 (P1) 获得胜利！P2 扑街。';
                    archiveWinner('p1');
                }
            }
        }

        // 让赢的那一方向 Cloudflare 最终上报结果，把 KV 里的房间关闭
        function archiveWinner(winner) {
            if (myRole === winner) {
                fetch('/api/room?action=click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId, gameId, player: myRole, totalClicks: 30 }) // 借用 click 的 30 分逻辑封顶结束游戏
                });
            }
        }

        // 画布渲染方法
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画网格背景线（暗黑街机感）
            ctx.strokeStyle = '#1e293b';
            for (let i = 0; i < canvas.width; i += grid) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 画食物
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444'; // 给食物加点霓虹微光
            ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
            ctx.shadowBlur = 0; // 重置发光

            // 画 P1 蛇身（粉色）
            ctx.fillStyle = '#ec4899';
            snake1.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = '#f472b6'; // 蛇头颜色浅一点
                else ctx.fillStyle = '#ec4899';
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });

            // 画 P2 蛇身（绿色）
            snake2.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = '#34d399'; // 蛇头颜色浅一点
                else ctx.fillStyle = '#10b981';
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });
        }

        init();
    </script>
</body>
</html>
