<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ 点击速度大赛（Supabase 毫秒同步版）</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; --accent-p1: #ec4899; --accent-p2: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 640px; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        button { padding: 12px 24px; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; cursor: pointer; }
        .btn-secondary { background: #334155; margin-bottom: 20px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #111827; border-radius: 10px; margin-top: 10px; }
        .badge { padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; }
        .badge.waiting { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge.playing { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .vs-container { display: flex; flex-direction: column; gap: 20px; margin: 25px 0; }
        .progress-track { width: 100%; height: 16px; background: #111827; border-radius: 8px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; }
        #p1-bar { background: linear-gradient(90deg, #ec4899, #f43f5e); }
        #p2-bar { background: linear-gradient(90deg, #10b981, #059669); }
        #game-status { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #f59e0b; }
        .huge-click-btn { width: 100%; padding: 25px; font-size: 1.5rem; background: linear-gradient(135deg, #ef4444, #3b82f6); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="view-lobby" class="view">
            <button class="btn-secondary" onclick="window.location.href='/'">← 返回主页</button>
            <div class="card">
                <h2>🏎️ 点击速度大赛</h2>
                <p>游戏开始后，双方玩家狂戳按钮。实时管道毫秒级同步能量条，率先戳满 30 次获胜！</p>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>🏠 活跃房间</h3>
                    <button onclick="createRoom()">+ 创建房间</button>
                </div>
                <ul id="room-list"></ul>
            </div>
        </div>

        <div id="view-game" class="view">
            <button class="btn-secondary" onclick="window.location.href='/click-race.html'">← 退出房间</button>
            <div class="card">
                <h2 id="game-title">游戏房间</h2>
                <span id="player-identity" class="badge" style="background: #334155;"></span>
                
                <div class="vs-container">
                    <div>
                        <div style="display: flex; justify-content: space-between;"><span>房主 (P1)</span><span id="p1-score">0 / 30</span></div>
                        <div class="progress-track"><div id="p1-bar" class="progress-bar"></div></div>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between;"><span>挑战者 (P2)</span><span id="p2-score">0 / 30</span></div>
                        <div class="progress-track"><div id="p2-bar" class="progress-bar"></div></div>
                    </div>
                </div>
                <div id="game-status">正在建立连接...</div>
                <button id="click-btn" class="huge-click-btn" onclick="sendClick()" disabled>🔥 猛烈点击！</button>
            </div>
        </div>
    </div>

    <script>
        // ⚡ 填入你的 Supabase 真实密钥，注意变量名避开冲突
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const gameId = 'click-race';
        let myRole = null;
        let gameChannel = null; // 实时通信信道
        let gameOver = false;

        // 本地局内分数状态管理
        let p1Clicks = 0;
        let p2Clicks = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        async function init() {
            if (!roomId) {
                document.getElementById('view-lobby').classList.add('active');
                fetchRooms();
            } else {
                document.getElementById('view-game').classList.add('active');
                document.getElementById('game-title').innerText = `房间 #${roomId}`;
                myRole = localStorage.getItem(`room_${roomId}_role`);
                
                // 1. 利用现有的后端同步基础状态并处理 P2 加入房间
                await syncBaseRoomStatus();

                // 2. 如果检测到依然是初始的默认密钥，进行防御保护提示
                if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                    document.getElementById('game-status').innerText = '❌ 未配置 Supabase 密钥';
                    alert('请在代码中配置您的 SUPABASE_URL 和 SUPABASE_ANON_KEY！');
                    return;
                }

                // 3. ✨ 核心提速：连通 Supabase 实时 WebSocket 通道
                connectSupabaseRealtime();
            }
        }

        // 依旧经过原后端服务拉取活跃房间列表
        async function fetchRooms() {
            const ul = document.getElementById('room-list');
            ul.innerHTML = '<p style="text-align:center;">正在探测时空房间...</p>';
            const res = await fetch(`/api/room?action=list&gameId=${gameId}&_t=${Date.now()}`);
            const rooms = await res.json();
            ul.innerHTML = rooms.length === 0 ? '<p style="text-align:center; color:#64748b;">暂无房间，快去创建一个吧！</p>' : '';
            rooms.forEach(r => {
                const li = document.createElement('li');
                li.className = 'room-item';
                li.innerHTML = `
                    <div><strong>房间 #${r.id}</strong><span class="badge ${r.status === 'waiting'?'waiting':'playing'}" style="margin-left:8px;">${r.status === 'waiting'?'等待中':'游戏中'}</span></div>
                    <button style="padding:6px 14px;" onclick="window.location.href='?roomId=${r.id}'" ${r.status !== 'waiting'?'disabled':''}>加入对局</button>
                `;
                ul.appendChild(li);
            });
        }

        // 依旧经过原后端服务创建房间
        async function createRoom() {
            const res = await fetch('/api/room?action=create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gameId })
            });
            const data = await res.json();
            localStorage.setItem(`room_${data.roomId}_role`, 'p1');
            window.location.href = `?roomId=${data.roomId}`;
        }

        // 用原接口确定玩家身份并在挑战者进入时修改状态
        async function syncBaseRoomStatus() {
            const res = await fetch(`/api/room?action=status&roomId=${roomId}&gameId=${gameId}&_t=${Date.now()}`);
            if (res.status === 404) { alert('房间不存在'); window.location.href = '/click-race.html'; return; }
            const room = await res.json();

            if (!myRole) {
                if (!room.p1) myRole = 'p1';
                else if (!room.p2) myRole = 'p2';
                else myRole = 'audience';
                localStorage.setItem(`room_${roomId}_role`, myRole);
            }

            document.getElementById('player-identity').innerText = { 'p1': '⚡ 房主 (P1)', 'p2': '🎯 挑战者 (P2)', 'audience': '👁️ 观众' }[myRole];
            
            // 当挑战者(P2)点击进入房间，且后端记录还处于waiting时，触发加入操作修改状态为playing
            if (room.status === 'waiting' && myRole === 'p2' && room.p2 !== 'joined') {
                const joinRes = await fetch('/api/room?action=join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId, gameId })
                });
                const updatedRoom = await joinRes.json();
                // 触发通知：让已经在屋里的 P1 发现 P2 进来了
                setTimeout(() => {
                    if (gameChannel) {
                        gameChannel.send({ type: 'broadcast', event: 'p2-entered', payload: {} });
                    }
                }, 1000);
            }
        }

        // ⚡ 建立 Supabase WebSocket 专属长连接
        function connectSupabaseRealtime() {
            gameChannel = supabaseClient.channel(`click-room-${roomId}`);

            gameChannel
                .on('broadcast', { event: 'click-event' }, (payload) => {
                    if (gameOver) return;
                    const data = payload.payload;

                    // 实时同步云端发过来的对手最新点击数
                    if (data.player === 'p1') p1Clicks = data.clicks;
                    if (data.player === 'p2') p2Clicks = data.clicks;

                    renderUI();
                })
                .on('broadcast', { event: 'p2-entered' }, () => {
                    // P1 接收到 P2 已经进屋的通知，立刻刷新页面启用按钮
                    location.reload();
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        // 通道连接成功，通过再次查询确定最新显示状态
                        checkCurrentStatusAndEnable();
                    }
                });
        }

        async function checkCurrentStatusAndEnable() {
            const res = await fetch(`/api/room?action=status&roomId=${roomId}&gameId=${gameId}&_t=${Date.now()}`);
            const room = await res.json();
            
            const btn = document.getElementById('click-btn');
            const statusText = document.getElementById('game-status');

            if (room.status === 'waiting') {
                statusText.innerText = '⏳ 等待挑战者进入房间...';
                btn.disabled = true;
            } else if (room.status === 'playing') {
                statusText.innerText = '🚀 比赛开始！开始狂飙手速！';
                btn.disabled = myRole === 'audience';
            } else if (room.status === 'finished') {
                p1Clicks = room.p1Score || 0;
                p2Clicks = room.p2Score || 0;
                gameOver = true;
                statusText.innerText = `🎉 胜利者是：${room.winner === 'p1' ? '房主 (P1)' : '挑战者 (P2)'}`;
                btn.disabled = true;
                renderUI();
            }
        }

        function renderUI() {
            // 实时渲染分数数字
            document.getElementById('p1-score').innerText = `${p1Clicks} / 30`;
            document.getElementById('p2-score').innerText = `${p2Clicks} / 30`;
            
            // 实时渲染能量条进度
            document.getElementById('p1-bar').style.width = `${Math.min((p1Clicks / 30) * 100, 100)}%`;
            document.getElementById('p2-bar').style.width = `${Math.min((p2Clicks / 30) * 100, 100)}%`;

            // 胜负判定逻辑
            if ((p1Clicks >= 30 || p2Clicks >= 30) && !gameOver) {
                gameOver = true;
                document.getElementById('click-btn').disabled = true;
                const winnerRole = p1Clicks >= 30 ? 'p1' : 'p2';
                document.getElementById('game-status').innerText = `🎉 胜利者是：${winnerRole === 'p1' ? '房主 (P1)' : '挑战者 (P2)'}`;
                
                // 由获胜方负责向 Cloudflare KV 进行一次最终存档，把房间状态闭环写入“已结束”
                if (myRole === winnerRole) {
                    fetch('/api/room?action=click', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomId, gameId, player: myRole, totalClicks: 30 })
                    });
                }
            }
        }

        // 玩家频繁狂点按钮触发
        function sendClick() {
            if (myRole !== 'p1' && myRole !== 'p2' || gameOver) return;

            // 本地数据立刻累加
            if (myRole === 'p1') p1Clicks++;
            if (myRole === 'p2') p2Clicks++;

            // 0延迟刷新自己的画面
            renderUI();

            // ⚡ 核心提速魔法：通过长连接将自己最新的点击绝对值“推”给对方
            gameChannel.send({
                type: 'broadcast',
                event: 'click-event',
                payload: { player: myRole, clicks: (myRole === 'p1' ? p1Clicks : p2Clicks) }
            });
        }

        init();
    </script>
</body>
</html>
