<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✌️ 剪刀石头布联机对战</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 640px; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        button { padding: 12px 24px; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; cursor: pointer; margin: 5px; }
        .btn-secondary { background: #334155; margin-bottom: 20px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #111827; border-radius: 10px; margin-top: 10px; }
        .choice-btn { font-size: 2rem; padding: 20px; width: 30%; }
        #game-status { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 20px 0; color: #f59e0b; }
        .badge { padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; background: #334155;}
    </style>
</head>
<body>
    <div class="container">
        <div id="view-lobby" class="view">
            <button class="btn-secondary" onclick="window.location.href='/'">← 返回主页</button>
            <div class="card">
                <h2>✌️ 剪刀石头布大赛</h2>
                <p>心理大博弈！选择你的出拳，等待对手出拳后揭晓胜负！</p>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>🏠 活跃房间</h3>
                    <button onclick="createRoom()">+ 创建房间</button>
                </div>
                <ul id="room-list"></ul>
            </div>
        </div>

        <div id="view-game" class="view">
            <button class="btn-secondary" onclick="window.location.href='/rps.html'">← 退出房间</button>
            <div class="card">
                <h2 id="game-title">游戏房间</h2>
                <span id="player-identity" class="badge"></span>
                
                <div id="game-status">等待对局开始...</div>

                <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                    <button class="choice-btn" id="btn-1" onclick="makeChoice(1)" disabled>✊</button>
                    <button class="choice-btn" id="btn-2" onclick="makeChoice(2)" disabled>✌️</button>
                    <button class="choice-btn" id="btn-3" onclick="makeChoice(3)" disabled>✋</button>
                </div>

                <div style="margin-top: 30px; color: var(--text-muted); text-align: center;">
                    <p id="p1-state">房主 (P1)：未出拳</p>
                    <p id="p2-state">挑战者 (P2)：未出拳</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameId = 'rps'; // 标记当前游戏为剪刀石头布
        let pollingInterval = null;
        let myRole = null;
        let hasChosen = false;

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        // 1=石头, 2=剪刀, 3=布 的映射文本
        const choiceMap = { 0: '未出拳', 1: '✊ 石头', 2: '✌️ 剪刀', 3: '✋ 布' };

        async function init() {
            if (!roomId) {
                document.getElementById('view-lobby').classList.add('active');
                fetchRooms();
            } else {
                document.getElementById('view-game').classList.add('active');
                document.getElementById('game-title').innerText = `房间 #${roomId}`;
                myRole = localStorage.getItem(`room_${roomId}_role`);
                
                pollRoomStatus();
                pollingInterval = setInterval(pollRoomStatus, 1000);
            }
        }

        // 获取房间列表
        async function fetchRooms() {
            const ul = document.getElementById('room-list');
            ul.innerHTML = '<p style="text-align:center;">正在探测房间...</p>';
            const res = await fetch(`/api/room?action=list&gameId=${gameId}&_t=${Date.now()}`);
            const rooms = await res.json();
            ul.innerHTML = rooms.length === 0 ? '<p style="text-align:center; color:#64748b;">暂无房间，快去创建一个吧！</p>' : '';
            rooms.forEach(r => {
                const li = document.createElement('li');
                li.className = 'room-item';
                li.innerHTML = `
                    <div><strong>房间 #${r.id}</strong></div>
                    <button style="padding:6px 14px;" onclick="window.location.href='?roomId=${r.id}'" ${r.status !== 'waiting'?'disabled':''}>加入对局</button>
                `;
                ul.appendChild(li);
            });
        }

        // 创建房间
        async function createRoom() {
            const res = await fetch('/api/room?action=create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gameId })
            });
            const data = await res.json();
            localStorage.setItem(`room_${data.roomId}_role`, 'p1');
            window.location.href = `?roomId=${data.roomId}`;
        }

        // 定时轮询房间状态
        async function pollRoomStatus() {
            const res = await fetch(`/api/room?action=status&roomId=${roomId}&gameId=${gameId}&_t=${Date.now()}`);
            if (res.status === 404) { alert('房间已解散'); window.location.href = '/rps.html'; return; }
            const room = await res.json();

            if (!myRole) {
                if (!room.p1) myRole = 'p1';
                else if (!room.p2) myRole = 'p2';
                else myRole = 'audience';
                localStorage.setItem(`room_${roomId}_role`, myRole);
            }

            document.getElementById('player-identity').innerText = { 'p1': '⚡ 房主 (P1)', 'p2': '🎯 挑战者 (P2)', 'audience': '👁️ 观众' }[myRole];

            const s1 = room.p1Score || 0; // P1的选择
            const s2 = room.p2Score || 0; // P2的选择

            const statusText = document.getElementById('game-status');

            if (room.status === 'waiting') {
                statusText.innerText = '⏳ 等待挑战者进入房间...';
                if (myRole === 'p2' && room.p2 !== 'joined') {
                    await fetch('/api/room?action=join', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomId, gameId })
                    });
                }
            } else if (room.status === 'playing') {
                statusText.innerText = '🎴 请出拳！';
                
                // 激活出拳按钮
                if (!hasChosen && (myRole === 'p1' || myRole === 'p2')) {
                    document.getElementById('btn-1').disabled = false;
                    document.getElementById('btn-2').disabled = false;
                    document.getElementById('btn-3').disabled = false;
                }

                // 显示谁已经准备好了（隐藏具体拳型以防作弊）
                document.getElementById('p1-state').innerText = `房主 (P1)：${s1 > 0 ? '👍 已出拳' : '⏳ 思考中'}`;
                document.getElementById('p2-state').innerText = `挑战者 (P2)：${s2 > 0 ? '👍 已出拳' : '⏳ 思考中'}`;

                // 如果双方都出拳了，前端直接判定胜负，并展示结果
                if (s1 > 0 && s2 > 0) {
                    clearInterval(pollingInterval); // 停止刷新
                    document.getElementById('p1-state').innerText = `房主 (P1) 出了：${choiceMap[s1]}`;
                    document.getElementById('p2-state').innerText = `挑战者 (P2) 出了：${choiceMap[s2]}`;
                    
                    // 判定算法
                    if (s1 === s2) {
                        statusText.innerText = '🤝 竟然平局了！';
                    } else if ((s1 === 1 && s2 === 2) || (s1 === 2 && s2 === 3) || (s1 === 3 && s2 === 1)) {
                        statusText.innerText = '🎉 房主 (P1) 获胜！';
                    } else {
                        statusText.innerText = '🎉 挑战者 (P2) 获胜！';
                    }
                }
            }
        }

        // 玩家点击出拳
        async function makeChoice(value) {
            hasChosen = true;
            // 禁用按钮，防止重复点击
            document.getElementById('btn-1').disabled = true;
            document.getElementById('btn-2').disabled = true;
            document.getElementById('btn-3').disabled = true;

            // 借用 click 后端接口，把选择存入数据库
            await fetch('/api/room?action=click', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId, gameId, player: myRole, totalClicks: value })
            });
        }

        init();
    </script>
</body>
</html>
