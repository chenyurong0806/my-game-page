<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏合集</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 640px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; }
        button:hover { background: linear-gradient(135deg, #4f46e5, #3b82f6); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>小游戏合集</h1>
        </header>

        <div class="card">
            <h2>✌️ 剪刀石头布</h2>
            <p>心理与运气的双重博弈！经典的猜拳对决，谁才是真正的猜拳之王？</p>
            <button onclick="window.location.href='/rps.html'">进入游戏大厅</button>
        </div>

        <div class="card">
            <h2>📚 背单词</h2>
            <p>在轻松的氛围中学习新词汇</p>
            <button onclick="window.location.href='./vocab.html'">进入游戏大厅</button>
        </div>

        <p>© 2026 LYCHENR // RHODES ISLAND</p>
    </div>
</body>
</html>
